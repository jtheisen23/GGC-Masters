<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 GGC Masters Auction</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a160a; color: #e8f5e9; font-family: 'Segoe UI', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a160a; }
    ::-webkit-scrollbar-thumb { background: #2d6a2d; border-radius: 3px; }
    #loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: #4ade80; font-size: 18px; }
    #app-nav { background: #0d1a0d; border-bottom: 1px solid #2d4a2d; display: flex; }
    .nav-btn {
      padding: 10px 24px; border: none; cursor: pointer; font-size: 13px; font-weight: 700;
      background: transparent; color: #8fbc8f; border-bottom: 3px solid transparent;
      transition: all 0.2s; font-family: inherit;
    }
    .nav-btn.active { background: #f5e642; color: #0a160a; border-bottom: 3px solid #f5e642; }
    #app-content { min-height: calc(100vh - 43px); }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">Loading 2026 GGC Masters...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="auction.js"></script>
  <script src="leaderboard.js"></script>
  <script>
    (function() {
      if (!window.React || !window.ReactDOM) {
        document.getElementById('root').innerHTML =
          '<div style="color:#f87171;padding:40px;text-align:center;font-family:sans-serif"><h2>Failed to load React</h2><p>Please check your internet connection and refresh.</p></div>';
        return;
      }
      if (!window.AuctionApp || !window.LeaderboardApp) {
        document.getElementById('root').innerHTML =
          '<div style="color:#f87171;padding:40px;text-align:center;font-family:sans-serif"><h2>Failed to load app scripts</h2><p>auction.js or leaderboard.js missing.</p></div>';
        return;
      }

      var React = window.React;
      var ReactDOM = window.ReactDOM;
      var currentPage = 'leaderboard';

      function render() {
        var root = document.getElementById('root');
        root.innerHTML = '';

        var nav = document.createElement('div');
        nav.id = 'app-nav';

        ['leaderboard', 'auction'].forEach(function(page) {
          var btn = document.createElement('button');
          btn.className = 'nav-btn' + (currentPage === page ? ' active' : '');
          btn.textContent = page === 'leaderboard' ? 'Live Leaderboard' : 'Auction Guide';
          btn.onclick = function() { currentPage = page; render(); };
          nav.appendChild(btn);
        });

        var content = document.createElement('div');
        content.id = 'app-content';

        root.appendChild(nav);
        root.appendChild(content);

        try {
          ReactDOM.createRoot(content).render(
            React.createElement(
              currentPage === 'leaderboard' ? window.LeaderboardApp : window.AuctionApp,
              null
            )
          );
        } catch(e) {
          content.innerHTML =
            '<div style="color:#f87171;padding:40px;font-family:monospace"><b>Error:</b><pre style="margin-top:12px;font-size:11px;white-space:pre-wrap;background:#1a0a0a;padding:16px;border-radius:8px">' +
            (e.stack || e.toString()) + '</pre></div>';
          console.error(e);
        }
      }

      render();
    })();
  </script>
</body>
</html>
